# ~/.job-search/companies.yml
# Your target companies for /job-scan.
# Copy this file from templates/companies.example.yml and customise — it's never overwritten by updates.
#
# api values:
#   greenhouse  → uses boards-api.greenhouse.io/v1/boards/<api_slug>/jobs
#   ashby       → uses api.ashbyhq.com/posting-api/job-board/<api_slug>
#   lever       → uses api.lever.co/v0/postings/<api_slug>
#   null        → Puppeteer scrapes the careers_url directly
#
# tier values:
#   1           → apply first (highest TC / best fit)
#   2           → apply with competing offers
#   3           → monitor / target senior levels only
#   practice    → interview reps, TC not the goal

companies:

  # ── Tier 1 examples ───────────────────────────────────────────────────────────

  - name: Stripe
    careers_url: https://stripe.com/jobs
    api: greenhouse
    api_slug: stripe
    tc_range: "$180–280K"
    tier: 1
    notes: "Search India team is a strong fit for data/search platform engineers"

  - name: Airbnb
    careers_url: https://careers.airbnb.com
    api: greenhouse
    api_slug: airbnb
    tc_range: "$180–260K"
    tier: 1
    notes: "Payments, BizTech AI, and Growth Platform teams"

  - name: Databricks
    careers_url: https://databricks.com/company/careers/open-positions
    api: greenhouse
    api_slug: databricks
    tc_range: "$180–300K"
    tier: 1
    notes: "Strong for Spark/data platform engineers. Target Staff level for top TC."

  - name: Anthropic
    careers_url: https://www.anthropic.com/careers/jobs
    api: lever
    api_slug: anthropic
    tc_range: "$250–400K"
    tier: 1
    notes: "AI platform and research engineering roles"

  - name: OpenAI
    careers_url: https://openai.com/careers
    api: greenhouse
    api_slug: openai
    tc_range: "$250–400K"
    tier: 1
    notes: "Platform, research infra, and applied AI engineering"

