[build-system]
requires = ["setuptools>=61.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "job-search-ai"
version = "1.0.0"
description = "E2E CLI-based automated job search assistant utilizing local LLMs and scrapers"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "typer>=0.9.0",
    "rich>=13.0.0",
    "pydantic>=2.0.0",
    "sqlalchemy>=2.0.0",
    "playwright>=1.30.0",
    "PyYAML>=6.0.0",
    "fastapi>=0.100.0",
    "uvicorn[standard]>=0.20.0"
]

[project.scripts]
job-search = "job_search.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["job_search*"]

[tool.setuptools.package-data]
job_search = ["ui/*"]

